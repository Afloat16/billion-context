name: Verify published bzip2 recovery files
on:
  push:
    branches: ["validation/craft-bzip2-concatenation-20261111"]
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: c16fae5391484a753a3a5bd13697c0dc6efb4967
          fetch-depth: 3
          path: base
          persist-credentials: false
      - name: Match published bytes to the successful preparation job
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          root=Path("base")
          expected=json.loads(Path("validation/.github/validation/bzip2_published_files.json").read_text())
          for path, content in expected["files"].items():
              actual=(root/path).read_bytes()
              assert actual == content.encode(), path
              print("VALIDATED_FILE",path,hashlib.sha256(actual).hexdigest())
          lock=hashlib.sha256((root/"Cargo.lock").read_bytes()).hexdigest()
          assert lock == expected["lock_sha256"], lock
          assert subprocess.check_output(["git","rev-parse","HEAD^"],cwd=root,text=True).strip() == "a22846cfda2551392c03c3bfbbdc046fd64d3ba2"
          changed=set(subprocess.check_output(["git","diff","--name-only","3ce1ce9f52077a53811be8a0309fdbe85b16b417","HEAD"],cwd=root,text=True).splitlines())
          assert changed == set(expected["files"]) | {"Cargo.lock","docs/ROADMAP.md","docs/STATUS.md","docs/pitfalls.md"}, changed
          print("BZ2_PUBLISHED_IDENTITY="+json.dumps({"validated_run":expected["validated_run"],"validated_job":expected["validated_job"],"head":"c16fae5391484a753a3a5bd13697c0dc6efb4967","lock_sha256":lock,"changed_files":sorted(changed)}))
          PY
      - name: Install fixed Rust and formatter
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: base -> target
          shared-key: craft-bzip2-concat-1.99
      - name: Validate final documentation and clean checkout
        working-directory: base
        run: |
          rustup override set 1.99.0
          cargo fmt --all --check
          cargo xtask layers
          cargo xtask locks
          cargo xtask secrets
          git diff --check
          test -z "$(git status --porcelain)"
