name: Validate Linux ELF signal origins with native process cores
on:
  push:
    branches: ["validation/craft-elf-signal-origins-20261111"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: c87a299d2765c54505e787584cd17f7f75fe5794
          fetch-depth: 3
          path: base
          persist-credentials: false
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Install the verified GDB package
        run: |
          sudo apt-get install -y --no-install-recommends gdb=15.1-1ubuntu1~24.04.1
          test "$(dpkg-query -W -f='${Version}' gdb)" = '15.1-1ubuntu1~24.04.1'
          gdb --version
          gdb -nx -q -batch -ex 'python import time; print("GDB_PYTHON_READY")'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: base -> target
          shared-key: craft-elf-siginfo-1.99
          cache-on-failure: true
      - name: Format the three proposed source and test files
        working-directory: base
        run: |
          rustup override set 1.99.0
          cargo fmt --all
      - name: Produce nine owned process cores and read native signal metadata
        run: python3 validation/.github/validation/elf_signal_native.py
      - name: Compare original and corrected APIs against the same native cores and regressions
        run: python3 validation/.github/validation/elf_signal_full_compare.py
      - name: Complete formats and engine suites and strict all-target Clippy
        working-directory: base
        run: |
          cargo fmt --all --check
          cargo test --locked -p craft-anything-formats -p craft-anything-engine --no-fail-fast
          cargo clippy --locked -p craft-anything-formats -p craft-anything-engine --all-targets -- -D warnings
      - name: Validate contracts and all L0-L2 WebAssembly targets
        working-directory: base
        run: |
          cargo xtask layers
          cargo xtask locks
          cargo xtask secrets
          cargo xtask wasm
          git diff --check
      - name: Export only fully validated formatted files and assert scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess
          root=Path("base")
          paths=["crates/formats/src/elf.rs","crates/formats/tests/elf_signal_origins.rs","crates/engine/tests/elf_signal_evidence.rs"]
          output=subprocess.check_output(["git","status","--porcelain","--untracked-files=all"],cwd=root,text=True)
          changed={line[3:] for line in output.splitlines()}
          assert changed.issubset(set(paths)), output
          hashes={}
          for path in paths:
              content=(root/path).read_text()
              sha=hashlib.sha256(content.encode()).hexdigest()
              hashes[path]=sha
              print("ELF_FORMATTED_FILE="+json.dumps({"path":path,"content":content,"sha256":sha}))
          print("ELF_VALIDATED_IDENTITY="+json.dumps({"candidate":"c87a299d2765c54505e787584cd17f7f75fe5794","files":hashes,"lock_sha256":hashlib.sha256((root/"Cargo.lock").read_bytes()).hexdigest(),"format_changed":sorted(changed)}))
          PY
