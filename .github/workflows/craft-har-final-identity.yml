name: Verify final HAR documentation identity
on:
  push:
    branches: ["validation/craft-har-final-identity-20261111"]
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: 477675b11378d50ec496a37c9717785b58add6fe
          fetch-depth: 3
          path: source
          persist-credentials: false
      - name: Preserve the fully tested implementation
        run: |
          test "$(git rev-parse HEAD~2)" = 0d26125bbdfbef2496cb4cfbdcfcf77a04c30dd9
          git diff --exit-code 0d26125bbdfbef2496cb4cfbdcfcf77a04c30dd9 HEAD -- . ':!docs/ROADMAP.md' ':!docs/STATUS.md' ':!docs/pitfalls.md'
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only", "0d26125bbdfbef2496cb4cfbdcfcf77a04c30dd9", "HEAD"], text=True).splitlines()
          assert changed == ["docs/ROADMAP.md", "docs/STATUS.md", "docs/pitfalls.md"], changed
          print("All production sources, tests, manifests and lockfiles match the fully tested head.")
          PY
          git diff --check 0d26125bbdfbef2496cb4cfbdcfcf77a04c30dd9 HEAD
      - name: Install fixed Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt
      - name: Use fixed compiler
        run: rustup override set 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: source -> target
          shared-key: craft-har-1.99
      - name: Formatting and secret scan
        run: |
          cargo fmt --all --check
          cargo xtask secrets
          git diff --check
          test -z "$(git status --porcelain)"
