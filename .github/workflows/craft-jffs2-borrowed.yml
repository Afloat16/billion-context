name: Verify final borrowed JFFS2 recovery
on:
  push:
    branches: ["validation/craft-jffs2-borrowed-payloads-20261111"]
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: fixed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: fd7a56682a8ab4659defde285b4f0a765e263857
          fetch-depth: 3
          path: fixed
          persist-credentials: false
      - name: Verify tested formats and dependency identity after the main rebase
        run: |
          git fetch --no-tags --depth=1 origin ee91a2b82639b673b140442615f9cab0bb71a73d
          git diff --exit-code ee91a2b82639b673b140442615f9cab0bb71a73d HEAD -- crates/formats Cargo.toml Cargo.lock
          python3 - <<'PY'
          import json, subprocess
          changed = set(subprocess.check_output(["git", "diff", "--name-only", "ee91a2b82639b673b140442615f9cab0bb71a73d", "HEAD", "--", ".", ":!docs"], text=True).splitlines())
          expected = {
              "crates/ai/src/cli_agents/adapters.rs",
              "crates/ai/src/cli_agents/grants.rs",
              "crates/ai/src/cli_agents/mod.rs",
              "crates/analysis/src/js_source.rs",
              "crates/analysis/tests/source_map_inventory_bounds.rs",
              "crates/engine/src/tools/application_tools.rs",
          }
          assert changed == expected, sorted(changed)
          for path in changed:
              current = subprocess.check_output(["git", "rev-parse", "HEAD:" + path], text=True)
              upstream = subprocess.check_output(["git", "rev-parse", "adeddc9149b97c21e595e743c9875d84e805eece:" + path], text=True)
              assert current == upstream, path
          print("IDENTITY=" + json.dumps({"formats_and_dependencies_identical": True, "unchanged_upstream_additions": sorted(changed)}))
          PY
      - name: Install fixed Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Use fixed compiler
        run: rustup override set 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: fixed -> target
          shared-key: craft-jffs2-1.99
      - name: Formatting and final JFFS2 compatibility controls
        run: |
          cargo fmt --all --check
          cargo test --locked -p craft-anything-formats --test jffs2_decoded_lengths --test jffs2_big_endian --test jffs2_unrecovered_size
      - name: Strict Clippy
        run: cargo clippy --locked -p craft-anything-formats --all-targets -- -D warnings
      - name: Repository contracts and all L0-L2 WebAssembly targets
        run: |
          cargo xtask layers
          cargo xtask locks
          cargo xtask secrets
          cargo xtask wasm
      - name: Clean final diff and dependencies
        run: |
          git diff --check adeddc9149b97c21e595e743c9875d84e805eece HEAD
          test -z "$(git status --porcelain)"
