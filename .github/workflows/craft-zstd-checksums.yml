name: Verify Zstandard checksum integration with current main
on:
  push:
    branches: ["validation/craft-zstd-checksums-20261111"]
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: 4064429ecfaaeb01e67720f30d698ce7c08e7189
          fetch-depth: 3
          path: fixed
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: 73826326c516b3f53b5e5997804cc38b0c2fd059
          path: tested
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-anything
          ref: 86d047cbc5368ca595c83e045893fb39c7f3f7f8
          path: upstream
          persist-credentials: false
      - name: Check exact tested files and complete upstream inheritance
        run: |
          python3 - <<'PY'
          import hashlib, subprocess
          from pathlib import Path
          paths = ["crates/formats/src/decompress.rs", "crates/formats/Cargo.toml", "Cargo.lock", "crates/formats/tests/zstd_checksums.rs"]
          for path in paths:
              current = Path("fixed", path).read_bytes()
              assert current == Path("tested", path).read_bytes(), path
              print("TESTED_FILE", path, hashlib.sha256(current).hexdigest())
          def entries(directory):
              raw = subprocess.check_output(["git", "ls-tree", "-r", "-z", "HEAD"], cwd=directory)
              return {row.split(b"\t", 1)[1]: row.split(b"\t", 1)[0] for row in raw.split(b"\0") if row}
          fixed, upstream = entries("fixed"), entries("upstream")
          changed = {p.decode() for p in fixed.keys() | upstream.keys() if fixed.get(p) != upstream.get(p)}
          expected = set(paths + ["docs/ROADMAP.md", "docs/STATUS.md"])
          assert changed == expected, sorted(changed)
          assert hashlib.sha256(Path("fixed/Cargo.lock").read_bytes()).hexdigest() == "de1d47a73ed27284bddc4a0e96c85b928c01b41f30e79c55d84a8806567210bf"
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], cwd="fixed", text=True).strip() == "4064429ecfaaeb01e67720f30d698ce7c08e7189"
          assert subprocess.check_output(["git", "rev-parse", "HEAD^^"], cwd="fixed", text=True).strip() == "86d047cbc5368ca595c83e045893fb39c7f3f7f8"
          print("INTEGRATION_IDENTITY: 4 tested product/test/dependency files identical; 6 total PR files; every other upstream blob and mode preserved")
          PY
      - name: Install fixed Rust
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: fixed -> target
          shared-key: craft-zstd-checksums-1.99
      - name: Full formats tests with current upstream changes
        working-directory: fixed
        run: |
          rustup override set 1.99.0
          cargo fmt --all --check
          cargo test --locked -p craft-anything-formats --no-fail-fast
          cargo clippy --locked -p craft-anything-formats --all-targets -- -D warnings
      - name: Repository contracts and all L0-L2 WebAssembly builds
        working-directory: fixed
        run: |
          cargo xtask layers
          cargo xtask locks
          cargo xtask secrets
          cargo xtask wasm
          git diff --check
          test -z "$(git status --porcelain)"
