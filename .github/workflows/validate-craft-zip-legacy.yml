name: Legacy Zstandard ZIP member validation

on:
  push:
    branches: [validation/craft-zip-legacy-zstandard-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formats:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: cce4d005e6c885a560e2d9e743328ee70eb858de
          fetch-depth: 5
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.99.0
          rustc --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify unchanged-source failures and controls
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          source = pathlib.Path("crates/formats/src/zip.rs")
          fixed = source.read_bytes()
          try:
              source.write_bytes(subprocess.check_output(["git", "show", "7116cc6cb486ada87497de2568c6b6db5a2ea783:crates/formats/src/zip.rs"]))
              result = subprocess.run(["cargo", "--config", 'profile.dev.package."*".opt-level=0', "test", "--locked", "-p", "craft-anything-formats", "--test", "zip_legacy_zstandard", "--", "--test-threads=1"], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              print(result.stdout, flush=True)
              failures = [
                  "legacy_method_is_named_without_rewriting_its_number",
                  "legacy_members_read_through_memory_and_seek_paths",
                  "legacy_members_keep_self_extracting_prefix_offsets",
                  "legacy_concatenated_frames_keep_the_whole_member",
                  "legacy_members_keep_crc_and_decoded_size_checks",
                  "legacy_damaged_and_truncated_frames_are_not_successful_members",
                  "legacy_decoder_honors_the_cap_when_the_directory_understates_size",
              ]
              if result.returncode == 0 or "test result: FAILED. 3 passed; 7 failed;" not in result.stdout:
                  raise SystemExit("Expected seven legacy-member regression failures and three passing controls")
              for name in failures:
                  if "test " + name + " ... FAILED" not in result.stdout:
                      raise SystemExit("Missing expected semantic failure: " + name)
          finally:
              source.write_bytes(fixed)
          PY
      - name: Verify corrected legacy members
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --locked -p craft-anything-formats --test zip_legacy_zstandard
      - name: Run the complete formats suite
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --locked -p craft-anything-formats
      - name: Run strict all-target Clippy
        run: cargo --config 'profile.dev.package."*".opt-level=0' clippy --locked -p craft-anything-formats --all-targets -- -D warnings
      - name: Check repository contracts
        run: |
          cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
          cargo --config 'profile.dev.package."*".opt-level=0' xtask locks
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
      - name: Check all L0-L2 WebAssembly crates
        run: cargo --config 'profile.dev.package."*".opt-level=0' xtask wasm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.14.0"
      - name: Compare generated ZIP payloads through both public readers
        run: |
          python3 - <<'PY'
          import io
          import json
          import os
          import pathlib
          import struct
          import sys
          import zipfile
          from compression import zstd
          proof = pathlib.Path(os.environ["RUNNER_TEMP"]) / "zip-legacy-proof"
          cases = proof / "cases"
          proof.joinpath("src").mkdir(parents=True, exist_ok=True)
          cases.mkdir(exist_ok=True)
          payloads = [
              b"generated by the standard ZIP writer",
              ("Unicode archive payload: 漢字🙂\n" * 512).encode(),
              bytes(range(256)) * 2048,
              b"bounded repetitive archive content\n" * 30000,
              b"",
          ]
          for index, plain in enumerate(payloads):
              output = io.BytesIO()
              with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_ZSTANDARD, compresslevel=3) as writer:
                  writer.writestr("assets/message.txt", plain)
              current = output.getvalue()
              with zipfile.ZipFile(io.BytesIO(current)) as reader:
                  entry = reader.infolist()[0]
                  assert entry.compress_type == 93
                  assert reader.read(entry) == plain
                  directory = reader.start_dir
                  local = entry.header_offset
                  name_length, extra_length = struct.unpack_from("<HH", current, local + 26)
                  data_at = local + 30 + name_length + extra_length
                  assert zstd.decompress(current[data_at:data_at + entry.compress_size]) == plain
              assert current[directory:directory + 4] == b"PK\x01\x02"
              legacy = bytearray(current)
              assert struct.unpack_from("<H", legacy, local + 8)[0] == 93
              assert struct.unpack_from("<H", legacy, directory + 10)[0] == 93
              struct.pack_into("<H", legacy, local + 8, 20)
              struct.pack_into("<H", legacy, directory + 10, 20)
              assert sum(a != b for a, b in zip(current, legacy)) == 2
              cases.joinpath(f"case-{index}-93.zip").write_bytes(current)
              cases.joinpath(f"case-{index}-20.zip").write_bytes(legacy)
              cases.joinpath(f"expected-{index}.bin").write_bytes(plain)
          print("Producer:", sys.version)
          print("Five Python-generated ZIPs plus equivalent legacy-header copies; current ZIP payloads independently read by Python and compression.zstd.")
          manifest = '[package]\nname="zip-legacy-proof"\nversion="0.1.0"\nedition="2024"\n[dependencies]\ncraft-anything-formats={path=' + json.dumps(str(pathlib.Path.cwd() / "crates/formats")) + '}\n'
          proof.joinpath("Cargo.toml").write_text(manifest, encoding="utf-8")
          proof.joinpath("src/main.rs").write_text("use craft_anything_formats::{zip, zip_file};\nuse std::io::Cursor;\nuse std::path::Path;\n\nfn main() {\n    let folder = std::env::args().nth(1).expect(\"generated fixture folder\");\n    for index in 0..5 {\n        let expected = std::fs::read(Path::new(&folder).join(format!(\"expected-{index}.bin\"))).unwrap();\n        for method in [20u16, 93] {\n            let bytes = std::fs::read(Path::new(&folder).join(format!(\"case-{index}-{method}.zip\"))).unwrap();\n            let archive = zip::parse(&bytes, 10).unwrap();\n            assert_eq!(archive.entries.len(), 1);\n            let entry = &archive.entries[0];\n            assert_eq!(entry.method, method);\n            assert_eq!(entry.method_name(), \"zstd\");\n            assert_eq!(zip::read_entry(&bytes, entry, expected.len() as u64).unwrap(), expected);\n            assert_eq!(zip_file::read_named_entry(&mut Cursor::new(&bytes), \"assets/message.txt\", expected.len() as u64).unwrap().unwrap(), expected);\n            println!(\"case {index}, method {method}: {} archive bytes -> {} identical payload bytes through both readers\", bytes.len(), expected.len());\n        }\n    }\n}\n", encoding="utf-8")
          PY
          cargo --config 'profile.dev.package."*".opt-level=0' run --manifest-path "$RUNNER_TEMP/zip-legacy-proof/Cargo.toml" --target-dir target -- "$RUNNER_TEMP/zip-legacy-proof/cases"
      - name: Verify the tested tree remains unchanged
        run: |
          git diff --check 7116cc6cb486ada87497de2568c6b6db5a2ea783 HEAD
          git diff --exit-code
