name: Claude advisor project case comparison
on:
  push:
    branches: [validation/claude-advisor-project-case-20261111]
permissions:
  contents: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/claude-mem
          ref: 762186be9969e7028001c401015d0f291f8ee553
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Verify actual advisor HTTP pagination and existing SQLite storage
        run: bun test tests/worker/http/routes/advisor-project-filter.test.ts --timeout 30000
      - name: Run advisor capture storage and project-read suites
        run: bun test tests/sqlite/session-store-advisor-calls.test.ts tests/worker/http/routes/advisor-routes.test.ts tests/cli/handlers/summarize-advisor-capture.test.ts tests/shared/advisor-transcript.test.ts tests/sqlite/project-key-case.test.ts tests/worker/http/routes/listing-project-scope.test.ts --timeout 30000
      - name: Check root and viewer TypeScript
        run: npm run typecheck
      - name: Build all shipped bundles
        run: node scripts/build-hooks.js
      - name: Check patch and test lane ownership
        run: |
          git diff --check 308a9ab4a141ac49ca0e72bbccc0c9cdf3770ca0 HEAD
          bun scripts/test-lanes.ts check
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/claude-mem
          ref: 9b049d51fe458100fb6d37e03bed6c8c3e6d5f82
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Reproduce omitted calls on unchanged main
        shell: bash
        run: |
          set +e
          bun test tests/worker/http/routes/advisor-project-filter.test.ts --timeout 30000 2>&1 | tee /tmp/advisor-baseline.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          grep -F '2 fail' /tmp/advisor-baseline.log
          grep -F '2 pass' /tmp/advisor-baseline.log
