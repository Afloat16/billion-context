name: Claude declared TypeScript function comparison
on:
  push:
    branches: [validation/claude-typescript-declared-functions-20261111]
permissions:
  contents: read
jobs:
  fixed:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/claude-mem
          ref: 70b86c2591eaac1db465ec97587fed16812b0179
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Require the actual native Tree-sitter CLI
        run: node_modules/.bin/tree-sitter --version
      - name: Verify native outline search and unfold behavior
        run: bun test tests/services/smart-file-read/typescript-declared-functions.test.ts --timeout 120000
      - name: Check all native smart file readers
        run: bun test tests/services/smart-file-read --timeout 120000
      - name: Check root and viewer TypeScript
        run: npm run typecheck
      - name: Build all shipped bundles
        run: node scripts/build-hooks.js
      - name: Check patch and test lane ownership
        run: |
          git diff --check 308a9ab4a141ac49ca0e72bbccc0c9cdf3770ca0 HEAD
          bun scripts/test-lanes.ts check
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/claude-mem
          ref: 2a89d824c7421a48500760362d0c1b0b81232c57
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Require the actual native Tree-sitter CLI
        run: node_modules/.bin/tree-sitter --version
      - name: Reproduce missing declarations on unchanged main
        shell: bash
        run: |
          set +e
          bun test tests/services/smart-file-read/typescript-declared-functions.test.ts --timeout 120000 2>&1 | tee /tmp/ambient-baseline.log
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          grep -F '5 fail' /tmp/ambient-baseline.log
          grep -F '1 pass' /tmp/ambient-baseline.log
