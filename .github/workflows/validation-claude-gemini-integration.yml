name: Claude Gemini integration comparison
on:
  push:
    branches: [validation/claude-gemini-integration-20261111]
permissions:
  contents: read
jobs:
  integration:
    name: integration on ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main-308a9ab
            ref: 308a9ab4a141ac49ca0e72bbccc0c9cdf3770ca0
          - label: gemini-9a0c682
            ref: 9a0c6828851c465af57e60b67b95e0a0ab9f3afa
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/claude-mem
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install Fish and ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y fish ripgrep
          fish --version
          rg --version
      - name: Build distribution for integration fixtures
        run: npm run build
      - name: Install upstream-pinned Claude Code for the auto-clear engine test
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.321 --no-audit --no-fund
          claude --version
      - name: Run unchanged integration lane
        shell: bash
        env:
          CLAUDE_MEM_TEST_PGVECTOR: '1'
          CLAUDE_MEM_TEST_AUTO_CLEAR_ENGINE: '1'
        run: bun scripts/test-lanes.ts integration 2>&1 | tee integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.label }}
          path: integration.log
          retention-days: 7
