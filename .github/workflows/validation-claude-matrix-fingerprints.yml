name: Claude sync matrix fingerprint diagnostics
on:
  push:
    branches: [validation/claude-matrix-fingerprint-detail-20261111]
permissions:
  contents: read
jobs:
  matrix:
    name: sync matrix on ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main-308a9ab
            ref: 308a9ab4a141ac49ca0e72bbccc0c9cdf3770ca0
          - label: codex-4f3bcac
            ref: 4f3bcacc35c168e3345695739d418d77335d0608
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sync_api_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d sync_api_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sync_api_test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/claude-mem
          ref: ${{ matrix.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Install sync-api dependencies
        working-directory: services/sync-api
        run: bun install --frozen-lockfile
      - name: Install viewer-host dependencies
        working-directory: services/viewer-host
        run: bun install --frozen-lockfile
      - name: Install My Work dependencies
        working-directory: src/ui/my-work
        run: npm ci --no-audit --no-fund
      - name: Warm Chrome
        run: time google-chrome --headless --no-sandbox --disable-gpu --dump-dom about:blank
      - name: Expose only the failing fixture's fingerprint inputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/services/work-view/shared-reviews.mjs")
          source = path.read_text()
          needle = "  return { version: SHARED_REVIEW_VERSION, requestId,\n    fingerprint: digest({ version: SHARED_REVIEW_VERSION, requestId, content: selected, evidence }),"
          replacement = "  return { ...(request.groupId === groupIdFor(JSON.stringify(['conversation', 'claude', 'matrix-view-main'])) ? { matrixDebug: { selected, evidence } } : {}), version: SHARED_REVIEW_VERSION, requestId,\n    fingerprint: digest({ version: SHARED_REVIEW_VERSION, requestId, content: selected, evidence }),"
          if source.count(needle) != 1:
              raise SystemExit("descriptor diagnostic target changed")
          path.write_text(source.replace(needle, replacement))
          path = Path("scripts/sync-matrix-e2e.ts")
          source = path.read_text()
          needle = "    'review fingerprints agree across distinct replica ids');"
          replacement = "    'review fingerprints agree across distinct replica ids', { local: { contentFingerprint: av.contentFingerprint, descriptor: av.sharedReviewDescriptor }, middle: { contentFingerprint: bv.contentFingerprint, descriptor: bv.sharedReviewDescriptor }, hosted: { contentFingerprint: cv.contentFingerprint, descriptor: cv.sharedReviewDescriptor } });"
          if source.count(needle) != 1:
              raise SystemExit("assertion diagnostic target changed")
          path.write_text(source.replace(needle, replacement))
          PY
      - name: Run the matrix with unchanged assertions and fresh PostgreSQL
        shell: bash
        run: bun scripts/sync-matrix-e2e.ts 2>&1 | tee matrix-fingerprint-inputs.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.label }}-fingerprint-inputs
          path: matrix-fingerprint-inputs.log
          retention-days: 7
