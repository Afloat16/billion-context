name: Claude native signature boundary comparison
on:
  push:
    branches: [validation/claude-native-signatures-20261111]
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/claude-mem
          ref: 3f32bcf62179ed1baaf9a31c00ebec89f5fc7d0e
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Compile the boundary fixtures with actual language tools
        run: |
          node --check tests/services/smart-file-read/fixtures/signature-boundaries.mjs
          node_modules/.bin/tsc --ignoreConfig --noEmit --target ES2022 --module esnext --moduleResolution bundler --skipLibCheck tests/services/smart-file-read/fixtures/signature-boundaries.ts
          g++ -std=c++17 -Wall -Werror -fsyntax-only tests/services/smart-file-read/fixtures/signature-boundaries.cpp
          mkdir -p "$RUNNER_TEMP/signature-java"
          javac --release 17 -d "$RUNNER_TEMP/signature-java" tests/services/smart-file-read/fixtures/SignatureBoundaries.java
          go version
          go tool compile -o "$RUNNER_TEMP/signature-go.o" tests/services/smart-file-read/fixtures/signature-boundaries.go
          rustc --version
          rustc --crate-name signature_boundaries --crate-type lib --edition=2021 tests/services/smart-file-read/fixtures/signature-boundaries.rs -o "$RUNNER_TEMP/signature-rust.rlib"
          php --version
          php -l tests/services/smart-file-read/fixtures/signature-boundaries.php
          kotlinc -version
          kotlinc tests/services/smart-file-read/fixtures/signature-boundaries.kt -d "$RUNNER_TEMP/signature-kotlin.jar"
          swiftc --version
          swiftc -typecheck tests/services/smart-file-read/fixtures/signature-boundaries.swift
          bash -n tests/services/smart-file-read/fixtures/signature-boundaries.sh
          node_modules/.bin/tree-sitter --version
      - name: Reproduce truncated headers on unchanged main
        shell: bash
        run: |
          git fetch --no-tags origin fb09d44807900c2f732a42fb8a1319cca03da3f9
          git checkout --detach fb09d44807900c2f732a42fb8a1319cca03da3f9
          set +e
          bun test tests/services/smart-file-read/native-signature-boundaries.test.ts --timeout 120000 2>&1 | tee "$RUNNER_TEMP/native-signature-baseline.log"
          result=${PIPESTATUS[0]}
          set -e
          test "$result" -eq 1
          grep -F '(fail) native function signature boundaries > retains destructured defaults' "$RUNNER_TEMP/native-signature-baseline.log"
          grep -F '(fail) native function signature boundaries > retains object parameters' "$RUNNER_TEMP/native-signature-baseline.log"
          grep -F '(pass) native function signature boundaries > preserves the existing unbraced-language and ordinary C paths' "$RUNNER_TEMP/native-signature-baseline.log"
      - name: Verify fixed signatures outline search and unfold
        run: |
          git checkout --detach 3f32bcf62179ed1baaf9a31c00ebec89f5fc7d0e
          bun test tests/services/smart-file-read/native-signature-boundaries.test.ts --timeout 120000
      - name: Run all native smart file regressions
        run: bun test tests/services/smart-file-read --timeout 120000
      - name: Check root and viewer TypeScript
        run: npm run typecheck
      - name: Build all shipped bundles
        run: node scripts/build-hooks.js
      - name: Check patch and lane ownership
        run: |
          git diff --check 308a9ab4a141ac49ca0e72bbccc0c9cdf3770ca0 HEAD
          bun scripts/test-lanes.ts check
