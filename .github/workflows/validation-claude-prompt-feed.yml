name: Claude legacy prompt feed final gates
on:
  push:
    branches: [validation/claude-legacy-prompt-window-20261111]
permissions:
  contents: read
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/claude-mem
          ref: 7487cc5d29d2b7f7fed598999e2704e0ec9b74ea
          fetch-depth: 4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Check source identity with the measured implementation
        run: |
          git diff --exit-code 864dd004f919ef2158d58229f900a3edb9c55f36 HEAD -- src
          git diff --exit-code f764afcfddfd8ddce916e7948abdf283fc3eaf9e HEAD -- tests/worker/prompt-feed-window.test.ts
      - name: Verify the bounded retry-window and pagination behavior
        run: bun test tests/worker/prompt-feed-window.test.ts --timeout 30000
      - name: Check native prompt migrations and existing feed behavior
        run: bun test tests/worker/pagination-helper-content-session-id.test.ts tests/sqlite/native-prompt-identity.test.ts tests/worker/http/routes/data-native-prompts.test.ts tests/worker/http/routes/data-native-prompt-import.test.ts tests/worker/http/routes/data-pagination-bounds.test.ts tests/worker/http/routes/native-prompt-init.test.ts tests/worker/http/routes/listing-project-scope.test.ts --timeout 30000
      - name: Check root and viewer TypeScript
        run: npm run typecheck
      - name: Build all shipped bundles
        run: node scripts/build-hooks.js
      - name: Check patch and lane ownership
        run: |
          git diff --check 308a9ab4a141ac49ca0e72bbccc0c9cdf3770ca0 HEAD
          bun scripts/test-lanes.ts check
