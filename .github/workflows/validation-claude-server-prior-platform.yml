name: Claude server prior-reply PostgreSQL gate
on:
  push:
    branches: [validation/claude-server-prior-platform-20261111]
permissions:
  contents: read
jobs:
  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: context_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d context_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLAUDE_MEM_TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/context_test
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Afloat16/claude-mem
          ref: cd76750e70687de3dc03de46c406a0e3885d7d36
          fetch-depth: 3
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Verify the fully tested production code and relocated test are unchanged
        run: |
          git diff --exit-code c30e848c64f110b25565b14f5600470f9ad3970f HEAD -- src/
          git show c30e848c64f110b25565b14f5600470f9ad3970f:tests/context/server-prior-transcript-platform.test.ts > /tmp/original-platform-test.ts
          cmp /tmp/original-platform-test.ts tests/server/server-prior-transcript-platform.test.ts
      - name: Install repository dependencies
        run: npm install --no-audit --no-fund
      - name: Verify final PostgreSQL regression and lane ownership
        run: |
          bun test tests/server/server-prior-transcript-platform.test.ts --timeout 60000
          bun scripts/test-lanes.ts check
          git grep -l -F 'process.env.CLAUDE_MEM_TEST_POSTGRES_URL' -- tests/server tests/storage tests/cli/server-jobs.test.ts tests/compat | grep -Fx 'tests/server/server-prior-transcript-platform.test.ts'
      - name: Check final patch whitespace
        run: git diff --check 308a9ab4a141ac49ca0e72bbccc0c9cdf3770ca0 HEAD
