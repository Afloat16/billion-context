name: ELF final head contracts

on:
  push:
    branches: [validation/craft-elf-stack-nx-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: b47806de6a9befaa5d700f269b8e9b4d58feee1a
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tested parser code and dependencies are identical
        run: |
          git diff --exit-code 2947261d62017f080aa547cf92c0a0ce64b50905 HEAD -- Cargo.toml Cargo.lock crates/formats crates/testkit crates/evidence crates/disasm crates/js crates/analysis xtask rustfmt.toml .cargo
          git diff --check 2cee4610f07164920ca9f02cd75cd84fa99cba3b HEAD
      - name: Install the validated Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0
      - name: Check final formatting and repository contracts
        run: |
          cargo fmt --all -- --check
          cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
          cargo --config 'profile.dev.package."*".opt-level=0' xtask locks
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
          git diff --exit-code
