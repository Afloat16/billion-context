name: Gitignore boundary escape validation

on:
  push:
    branches: [validation/craft-gitignore-boundary-escapes-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ignore-boundaries:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: debc7600479d7d7d8ebfc229cb6ddf267243b099
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.99.0
          rustc --version
          node --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: craft-gitignore-boundaries-full-v1
          save-if: true
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Reproduce original ignore boundary failures and controls
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          path = pathlib.Path("crates/analysis/src/js_source.rs")
          fixed = path.read_bytes()
          try:
              path.write_bytes(subprocess.check_output(["git", "show", "22c44d01d271c49187104802459085f273f855f0:" + path.as_posix()]))
              result = subprocess.run(
                  ["cargo", "--config", 'profile.dev.package."*".opt-level=0', "test", "--locked",
                   "-p", "craft-anything-analysis", "--test", "gitignore_boundary_escapes", "--", "--nocapture"],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              print(result.stdout, end="")
              failures = {
                  "leading_escaped_glob_characters_remain_literal",
                  "leading_literal_backslashes_are_not_consumed_twice",
                  "escaped_trailing_spaces_survive_padding_removal",
                  "non_space_trailing_whitespace_is_part_of_the_filename",
                  "an_unfinished_escape_never_matches_or_negates_a_rule",
                  "line_endings_remove_only_one_carriage_return",
                  "escaped_names_respect_the_nested_ignore_file_base",
              }
              if result.returncode == 0 or "test result: FAILED. 2 passed; 7 failed;" not in result.stdout:
                  raise SystemExit("Original source did not reproduce seven failures and two passing controls")
              failure_list = result.stdout.rsplit("failures:", 1)[-1].split("test result:", 1)[0]
              actual_failures = {line.strip() for line in failure_list.splitlines() if line.strip()}
              if actual_failures != failures:
                  raise SystemExit("Unexpected original-source failure set: " + repr(actual_failures))
          finally:
              path.write_bytes(fixed)
          PY
      - name: Run the full analysis suite
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --locked -p craft-anything-analysis
      - name: Compare fixed reference-source ignore matching with Git
        run: |
          mkdir -p crates/analysis/examples
          trap 'rm -f crates/analysis/examples/validation_ignore_boundaries.rs' EXIT
          cat > crates/analysis/examples/validation_ignore_boundaries.rs <<'RUST'
          use std::io::Read;
          use craft_anything_analysis::js_source::Ignore;
          use serde::Deserialize;
          
          #[derive(Deserialize)]
          struct Case {
              base: String,
              rules: String,
              paths: Vec<String>,
          }
          
          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
              let cases: Vec<Case> = serde_json::from_str(&input).unwrap();
              let output: Vec<Vec<bool>> = cases.into_iter().map(|case| {
                  let mut ignore = Ignore::default();
                  ignore.add_file(&case.base, &case.rules);
                  case.paths.iter().map(|path| ignore.is_ignored(path, false)).collect()
              }).collect();
              println!("{}", serde_json::to_string(&output).unwrap());
          }
          RUST
          cargo --config 'profile.dev.package."*".opt-level=0' build --locked -p craft-anything-analysis --example validation_ignore_boundaries
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const path = require("node:path");
          const { execFileSync, spawnSync } = require("node:child_process");
          const cases = [
            {
              "name": "leading_star",
              "base": "",
              "rules": "\\*.js\n",
              "paths": [
                "*.js",
                "app.js",
                "nested/*.js",
                "nested/app.js"
              ]
            },
            {
              "name": "leading_question",
              "base": "",
              "rules": "\\?.js\n",
              "paths": [
                "?.js",
                "a.js",
                "ab.js"
              ]
            },
            {
              "name": "leading_bracket",
              "base": "",
              "rules": "\\[ab].js\n",
              "paths": [
                "[ab].js",
                "a.js",
                "b.js"
              ]
            },
            {
              "name": "leading_backslash",
              "base": "",
              "rules": "\\\\cache.js\n",
              "paths": [
                "\\cache.js",
                "cache.js"
              ]
            },
            {
              "name": "escaped_hash",
              "base": "",
              "rules": "\\#note.js\n",
              "paths": [
                "#note.js",
                "note.js"
              ]
            },
            {
              "name": "escaped_bang",
              "base": "",
              "rules": "\\!keep.js\n",
              "paths": [
                "!keep.js",
                "keep.js"
              ]
            },
            {
              "name": "escaped_trailing_space",
              "base": "",
              "rules": "trail\\ \n",
              "paths": [
                "trail ",
                "trail",
                "nested/trail "
              ]
            },
            {
              "name": "escaped_space_then_padding",
              "base": "",
              "rules": "trail\\   \n",
              "paths": [
                "trail ",
                "trail",
                "trail  "
              ]
            },
            {
              "name": "escaped_backslash_then_padding",
              "base": "",
              "rules": "trail\\\\  \n",
              "paths": [
                "trail\\",
                "trail",
                "trail\\ "
              ]
            },
            {
              "name": "invalid_terminal_escape",
              "base": "",
              "rules": "trailing\\\n",
              "paths": [
                "trailing",
                "trailing\\"
              ]
            },
            {
              "name": "invalid_negation_escape",
              "base": "",
              "rules": "*.js\n!keep.js\\\n",
              "paths": [
                "keep.js",
                "other.js"
              ]
            },
            {
              "name": "literal_trailing_tab",
              "base": "",
              "rules": "tab\t\n",
              "paths": [
                "tab\t",
                "tab"
              ]
            },
            {
              "name": "literal_trailing_nbsp",
              "base": "",
              "rules": "unicode \n",
              "paths": [
                "unicode ",
                "unicode"
              ]
            },
            {
              "name": "terminal_carriage_without_newline",
              "base": "",
              "rules": "line\r",
              "paths": [
                "line",
                "line\r"
              ]
            },
            {
              "name": "escaped_space_before_crlf",
              "base": "",
              "rules": "line\\ \r\n",
              "paths": [
                "line ",
                "line"
              ]
            },
            {
              "name": "two_carriages_before_newline",
              "base": "",
              "rules": "line\r\r\n",
              "paths": [
                "line\r",
                "line"
              ]
            },
            {
              "name": "ordinary_glob_and_negation",
              "base": "",
              "rules": "*.js\n!keep.js\n",
              "paths": [
                "app.js",
                "keep.js",
                "app.txt",
                "nested/app.js",
                "nested/keep.js"
              ]
            },
            {
              "name": "nested_ignore_base",
              "base": "pkg",
              "rules": "\\*.js\n",
              "paths": [
                "pkg/*.js",
                "pkg/app.js",
                "*.js",
                "app.js"
              ]
            },
            {
              "name": "anchored_literal_star",
              "base": "",
              "rules": "/\\*.js\n",
              "paths": [
                "*.js",
                "app.js",
                "nested/*.js"
              ]
            },
            {
              "name": "escaped_ordinary_character",
              "base": "",
              "rules": "\\a.js\n",
              "paths": [
                "a.js",
                "\\a.js",
                "b.js"
              ]
            }
          ];
          const craft = JSON.parse(execFileSync("target/debug/examples/validation_ignore_boundaries", {
            input: JSON.stringify(cases), encoding: "utf8",
          }));
          const root = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, "craft-ignore-reference-"));
          const environment = { ...process.env, GIT_CONFIG_NOSYSTEM: "1", GIT_CONFIG_GLOBAL: "/dev/null" };
          const outcomes = [];
          try {
            cases.forEach((test, index) => {
              const cwd = path.join(root, String(index));
              fs.mkdirSync(cwd);
              execFileSync("git", ["init", "--quiet"], { cwd, env: environment });
              for (const name of test.paths) {
                const filename = path.join(cwd, name);
                fs.mkdirSync(path.dirname(filename), { recursive: true });
                fs.writeFileSync(filename, "// fixture\n");
              }
              const ignorePath = path.join(cwd, test.base, ".gitignore");
              fs.mkdirSync(path.dirname(ignorePath), { recursive: true });
              fs.writeFileSync(ignorePath, test.rules);
              const expected = test.paths.map(name => {
                const result = spawnSync("git", ["-c", "core.excludesFile=/dev/null", "check-ignore", "--no-index", "-q", "--", name],
                  { cwd, env: environment, encoding: "utf8" });
                assert.ok(result.status === 0 || result.status === 1, result.stderr);
                return result.status === 0;
              });
              const mismatches = test.paths.filter((_, position) => craft[index][position] !== expected[position]);
              outcomes.push({ name: test.name, paths: test.paths, git: expected, craft: craft[index], mismatches });
            });
            const reference = {"leading_star":[true,false,true,false],"leading_question":[true,false,false],"leading_bracket":[true,false,false],"leading_backslash":[true,false],"escaped_hash":[true,false],"escaped_bang":[true,false],"escaped_trailing_space":[true,false,true],"escaped_space_then_padding":[true,false,false],"escaped_backslash_then_padding":[true,false,false],"invalid_terminal_escape":[false,false],"invalid_negation_escape":[true,true],"literal_trailing_tab":[true,false],"literal_trailing_nbsp":[true,false],"terminal_carriage_without_newline":[true,false],"escaped_space_before_crlf":[true,false],"two_carriages_before_newline":[true,false],"ordinary_glob_and_negation":[true,false,false,true,false],"nested_ignore_base":[true,false,false,false],"anchored_literal_star":[true,false,false],"escaped_ordinary_character":[true,false,false]};
            for (const outcome of outcomes) {
              assert.deepEqual(outcome.git, reference[outcome.name], outcome.name + " original Git contract");
              assert.deepEqual(outcome.craft, outcome.git, outcome.name + " fixed ignore matching");
            }
            console.log("Fixed ignore boundary comparison / " + execFileSync("git", ["--version"], { encoding: "utf8" }).trim() +
              " / Node " + process.version + ": " + JSON.stringify(outcomes));
          } finally {
            fs.rmSync(root, { recursive: true, force: true });
          }
          NODE
      - name: Run strict all-target analysis Clippy
        run: cargo --config 'profile.dev.package."*".opt-level=0' clippy --locked -p craft-anything-analysis --all-targets -- -D warnings
      - name: Check repository contracts
        run: |
          cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
          cargo --config 'profile.dev.package."*".opt-level=0' xtask locks
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
      - name: Check all WebAssembly layers
        run: cargo --config 'profile.dev.package."*".opt-level=0' xtask wasm
      - name: Require formatting and an unchanged source tree
        run: |
          cargo fmt --all -- --check
          git diff --exit-code
