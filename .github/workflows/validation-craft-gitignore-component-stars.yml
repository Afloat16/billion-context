name: Gitignore component-star full validation

on:
  push:
    branches: [validation/craft-gitignore-component-stars-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  component-stars:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: 0ba6fc7ef7efbf12d63fe0fcb0557da379eadf96
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: craft-gitignore-component-stars-full-v1
          save-if: true
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Reproduce original component-boundary errors
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          path = pathlib.Path("crates/analysis/src/js_source.rs")
          fixed = path.read_bytes()
          failures = {
              "trailing_filename_stars_do_not_remove_the_required_separator",
              "embedded_filename_star_runs_do_not_cross_directories",
              "leading_filename_star_runs_stay_in_their_component",
              "complete_star_components_match_zero_or_more_directories",
              "escaped_directory_separators_do_not_promote_filename_stars",
              "recursive_and_filename_stars_keep_their_separate_roles",
          }
          try:
              path.write_bytes(subprocess.check_output(["git", "show", "3ce1ce9f52077a53811be8a0309fdbe85b16b417:" + path.as_posix()]))
              result = subprocess.run(
                  ["cargo", "--config", 'profile.dev.package."*".opt-level=0', "test", "--locked",
                   "-p", "craft-anything-analysis", "--test", "gitignore_component_stars", "--", "--nocapture"],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              print(result.stdout, end="")
              if result.returncode == 0 or "test result: FAILED. 3 passed; 6 failed;" not in result.stdout:
                  raise SystemExit("Expected six star-component regressions and three controls on the unchanged matcher")
              listed = result.stdout.rsplit("failures:", 1)[-1].split("test result:", 1)[0]
              actual = {line.strip() for line in listed.splitlines() if line.strip()}
              assert actual == failures, actual
          finally:
              path.write_bytes(fixed)
          PY
      - name: Run the complete analysis suite
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --locked -p craft-anything-analysis
      - name: Compare public ignore matching with native Git
        run: |
          mkdir -p crates/analysis/examples
          trap 'rm -f crates/analysis/examples/validation_gitignore_component_stars.rs' EXIT
          cat > crates/analysis/examples/validation_gitignore_component_stars.rs <<'RS'
          use craft_anything_analysis::js_source::Ignore;
          use std::io::Read;
          
          fn main() {
              let mut text = String::new();
              std::io::stdin().read_to_string(&mut text).unwrap();
              let input: serde_json::Value = serde_json::from_str(&text).unwrap();
              let mut ignore = Ignore::default();
              ignore.add_file("", input["rule"].as_str().unwrap());
              let matches: Vec<bool> = input["paths"].as_array().unwrap().iter()
                  .map(|path| ignore.is_ignored(path.as_str().unwrap(), false)).collect();
              println!("{}", serde_json::to_string(&matches).unwrap());
          }
          RS
          cargo --config 'profile.dev.package."*".opt-level=0' build --locked -p craft-anything-analysis --example validation_gitignore_component_stars
          cat > /tmp/validation_gitignore_component_stars.py <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import tempfile
          
          RULES = [
              "root/a**/leaf", "root/**a/leaf", "root/a**b/leaf",
              "root/pre***post/leaf", "root/a***/leaf", "root/***a/leaf",
              "root/***/leaf", "root/****/leaf",
              "root/**/leaf", "**/leaf", "root/**", "root/*/leaf", "root/ab*cd/leaf",
              r"root/\**/leaf", r"root/*\*/leaf", r"root/**\/leaf",
              r"root\/a**/leaf", r"root\/**/leaf", r"root/\*\*/leaf",
              "root/**/a**/leaf", "root/**/**/leaf", "root/***/a**b/leaf",
          ]
          PATHS = [
              "leaf", "deep/leaf", "root/leaf", "root/aleaf", "root/x/aleaf",
              "root/a/leaf", "root/ab/leaf", "root/ax/leaf", "root/axb/leaf",
              "root/x/a/leaf", "root/x/ax/leaf", "root/a/x/leaf", "root/a/x/b/leaf",
              "root/x/a/x/b/leaf", "root/prepost/leaf", "root/pre/post/leaf",
              "root/prexpost/leaf", "root/x/prepost/leaf", "root/abcd/leaf",
              "root/abXcd/leaf", "root/ab/Xcd/leaf", "root/*/leaf", "root/**/leaf",
              "root/***/leaf", "root/*x/leaf", "root/x*/leaf", "root/x/y/leaf",
              "root/工具/leaf", "root/a工具/leaf", "root/a/工具/b/leaf",
              "other/a/leaf", "root/x/other", "other/leaf",
          ]
          CONTROLS = {"root/**/leaf", "**/leaf", "root/**", "root/*/leaf", "root/ab*cd/leaf", r"root/\*\*/leaf"}
          EXAMPLE = pathlib.Path("target/debug/examples/validation_gitignore_component_stars").resolve()
          env = {**os.environ, "GIT_CONFIG_NOSYSTEM":"1", "GIT_CONFIG_GLOBAL":os.devnull}
          results = []
          with tempfile.TemporaryDirectory(prefix="craft-gitignore-components-") as folder:
              root = pathlib.Path(folder)
              subprocess.run(["git", "init", "-q", str(root)], check=True, env=env)
              for path in PATHS:
                  fixture = root / path
                  fixture.parent.mkdir(parents=True, exist_ok=True)
                  fixture.write_text("fixture\n")
              for rule in RULES:
                  (root / ".gitignore").write_text(rule + "\n")
                  result = subprocess.run(["git", "-C", str(root), "check-ignore", "--no-index", "-z", "--stdin"],
                      input=b"".join(path.encode() + b"\0" for path in PATHS),
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE, env=env)
                  assert result.returncode in (0, 1), result.stderr.decode()
                  ignored = {path.decode() for path in result.stdout.split(b"\0") if path}
                  expected = [path in ignored for path in PATHS]
                  visible = {path.decode() for path in subprocess.check_output(["git", "-C", str(root), "ls-files", "--others", "--exclude-standard", "-z"], env=env).split(b"\0") if path}
                  assert [path not in visible for path in PATHS] == expected, (rule, visible, ignored)
                  actual = json.loads(subprocess.check_output([str(EXAMPLE)],
                      input=json.dumps({"rule":rule + "\n", "paths":PATHS}), text=True))
                  assert len(actual) == len(expected)
                  mismatches = [{"path":path, "git":a, "product":b} for path,a,b in zip(PATHS, expected, actual) if a != b]
                  if rule in CONTROLS:
                      assert not mismatches, (rule, mismatches)
                  if os.getenv("EXPECT_FIXED"):
                      assert not mismatches, (rule, mismatches)
                  row = {"rule":rule, "paths":len(PATHS), "mismatches":mismatches}
                  results.append(row)
                  print(json.dumps(row, ensure_ascii=False), flush=True)
          if not os.getenv("EXPECT_FIXED"):
              observed = {(row["rule"], mismatch["path"]) for row in results for mismatch in row["mismatches"]}
              required = {
                  ("root/a**/leaf", "root/aleaf"),
                  ("root/a**/leaf", "root/a/x/leaf"),
                  ("root/**a/leaf", "root/x/a/leaf"),
                  ("root/a**b/leaf", "root/a/x/b/leaf"),
              }
              assert required <= observed, observed
          print(json.dumps({"git":subprocess.check_output(["git", "--version"], text=True).strip(),
              "rules":len(RULES), "paths":len(PATHS), "comparisons":len(RULES)*len(PATHS),
              "mismatches":sum(len(row["mismatches"]) for row in results), "control_rules":len(CONTROLS), "real_tree_inventories":len(RULES)}), flush=True)
          PY
          EXPECT_FIXED=1 python3 /tmp/validation_gitignore_component_stars.py
          git diff --exit-code
      - name: Run strict all-target Clippy
        run: cargo --config 'profile.dev.package."*".opt-level=0' clippy --locked -p craft-anything-analysis --all-targets -- -D warnings
      - name: Check repository contracts
        run: |
          cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
          cargo --config 'profile.dev.package."*".opt-level=0' xtask locks
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
      - name: Check all WebAssembly layers
        run: cargo --config 'profile.dev.package."*".opt-level=0' xtask wasm
      - name: Require formatting and an unchanged source tree
        run: |
          cargo fmt --all -- --check
          git diff --check
          git diff --exit-code
