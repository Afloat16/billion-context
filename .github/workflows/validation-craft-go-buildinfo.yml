name: Craft Go final source identity
on:
  push:
    branches: [validation/craft-go-buildinfo-diagnostics-20261111]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    defaults:
      run:
        working-directory: candidate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: bfe391a2da3c36bb76af7256c8c0fbec15209d96
          path: candidate
          fetch-depth: 5
          persist-credentials: false
      - name: Verify exact tested source and claim ancestry
        run: python3 "$GITHUB_WORKSPACE/validation/.github/validation/go_final_identity.py"
      - name: Install exact CI formatting toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0
      - name: Verify formatting and repository contracts
        run: |
          cargo fmt --all -- --check
          cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
          cargo --config 'profile.dev.package."*".opt-level=0' xtask locks
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
      - name: Check patch whitespace and clean checkout
        run: |
          git diff --check 3ce1ce9f52077a53811be8a0309fdbe85b16b417 HEAD
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
