name: JavaScript array-spread identity validation

on:
  push:
    branches: [validation/craft-js-array-spreads-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: 42098250e9fbbc3f5576bc286ca0e87d966968fe
          fetch-depth: 0
          persist-credentials: false
      - name: Verify only the validation status changed
        run: |
          python3 - <<'PY'
          import subprocess
          paths = subprocess.check_output(
              ["git", "diff", "--name-only", "ae17c06c0aebd7d364d18b8f898991362277743e", "HEAD"], text=True,
          ).splitlines()
          if paths != ["docs/ROADMAP.md", "docs/STATUS.md"]:
              raise SystemExit("Expected the fully tested implementation and dependencies to remain identical: " + repr(paths))
          print("All production, test, dependency and workflow files match validated commit ae17c06c exactly.")
          PY
      - name: Install the validated Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0
          rustc --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: craft-js-array-spreads-v1
          save-if: true
          cache-on-failure: true
      - name: Check the final document revision
        run: |
          cargo fmt --all -- --check
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
          git diff --check ae17c06c0aebd7d364d18b8f898991362277743e HEAD
          git diff --exit-code
