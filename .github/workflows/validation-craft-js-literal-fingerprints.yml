name: JavaScript literal fingerprint final-document validation

on:
  push:
    branches: [validation/craft-js-literal-fingerprints-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  literal-fingerprints:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: b2852f5be20729800dbda67286324ac2e48cb8cb
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: craft-js-literal-fingerprints-framing-v2
          save-if: true
          cache-on-failure: true
      - name: Verify unchanged implementation, tests and dependencies
        run: |
          python3 - <<'PY'
          import subprocess
          base = "7d3dd731920f2d6158ee96c407ec6924f4b12337"
          changed = set(subprocess.check_output(["git", "diff", "--name-only", base, "HEAD"], text=True).splitlines())
          assert changed == {"docs/ROADMAP.md", "docs/STATUS.md"}, changed
          subprocess.run(["git", "diff", "--exit-code", base, "HEAD", "--", ".", ":(exclude)docs/ROADMAP.md", ":(exclude)docs/STATUS.md"], check=True)
          print("All implementation, test and dependency files are identical to the fully validated source.")
          PY
      - name: Validate final documents
        run: |
          cargo fmt --all -- --check
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
          git diff --check 7d3dd731920f2d6158ee96c407ec6924f4b12337 HEAD
          git diff --exit-code
