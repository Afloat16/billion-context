name: JavaScript fingerprint framing diagnostic

on:
  push:
    branches: [validation/craft-js-literal-fingerprints-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  literal-fingerprints:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: ed087f661d3e5766d8806f095b0d8548d9a09fda
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: craft-js-literal-fingerprints-full-v1
          save-if: true
          cache-on-failure: true
      - name: Compare previous-head fingerprints with actual JavaScript results
        run: |
          mkdir -p crates/js/examples
          trap 'rm -f crates/js/examples/validation_literal_framing.rs' EXIT
          cat > crates/js/examples/validation_literal_framing.rs <<'RUST'
          use craft_anything_js::{Limits, analyze};
          use std::io::Read;
          
          fn main() {
              let mut source = String::new();
              std::io::stdin().read_to_string(&mut source).unwrap();
              let facts = analyze("module.js", &source, &Limits::default()).facts;
              println!("{}", serde_json::json!({"fingerprint": facts.fingerprint}));
          }
          RUST
          cargo --config 'profile.dev.package."*".opt-level=0' build --locked -p craft-anything-js --example validation_literal_framing
          node <<'NODE'
          const assert = require("node:assert/strict");
          const path = require("node:path");
          const vm = require("node:vm");
          const { execFileSync } = require("node:child_process");
          const binary = path.resolve("target/debug/examples/validation_literal_framing");
          const pairs = [
            { label: "nul-string-node-boundary", left: 'globalThis.result = ["a","b"];',
              right: "globalThis.result = " + JSON.stringify(["a\0StringLiteral;b"]) + ";", equivalent: false },
            { label: "empty-array-tree-boundary", left: "globalThis.result = [[], []];",
              right: "globalThis.result = [[[]]];", equivalent: false },
            { label: "escaped-nul-equivalence-control", left: String.raw`globalThis.result = ["a\0b"];`,
              right: String.raw`globalThis.result = ["a\u0000b"];`, equivalent: true },
          ];
          const rows = pairs.map(({ label, left, right, equivalent }) => {
            const execute = source => {
              const context = {};
              vm.runInNewContext(source, context, { timeout: 1000 });
              return JSON.stringify(context.result);
            };
            const results = [execute(left), execute(right)];
            assert.equal(results[0] === results[1], equivalent, label);
            const hashes = [left, right].map(source => JSON.parse(execFileSync(binary, { input: source, encoding: "utf8" })).fingerprint);
            const row = { label, equivalent, results, hashes, fingerprintsEqual: hashes[0] === hashes[1] };
            console.log("LITERAL_FRAMING_ROW " + JSON.stringify(row));
            return row;
          });
          assert.ok(rows.some(row => !row.equivalent && row.fingerprintsEqual), "the previous head must reproduce a framing collision");
          assert.ok(rows.filter(row => row.equivalent).every(row => row.fingerprintsEqual));
          console.log("LITERAL_FRAMING_EVIDENCE " + JSON.stringify({ node: process.version, cases: rows.length,
            semanticCollisions: rows.filter(row => !row.equivalent && row.fingerprintsEqual).length }));
          NODE
      - name: Require unchanged source
        run: git diff --exit-code
