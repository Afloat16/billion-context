name: Recovered module path byte validation

on:
  push:
    branches: [validation/craft-js-module-path-bytes-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  module-path-bytes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: 258b7df17de106b5ef907bb32440c53c99c664fd
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.99.0
          rustc --version
          node --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: craft-js-module-path-bytes-v1
          save-if: true
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Reproduce original byte-budget failures and controls
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          path = pathlib.Path("crates/js/src/recover.rs")
          fixed = path.read_bytes()
          try:
              path.write_bytes(subprocess.check_output(["git", "show", "7116cc6cb486ada87497de2568c6b6db5a2ea783:" + path.as_posix()]))
              result = subprocess.run(
                  ["cargo", "--config", 'profile.dev.package."*".opt-level=0', "test", "--locked",
                   "-p", "craft-anything-js", "--test", "recovery_path_byte_budget", "--", "--nocapture"],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              print(result.stdout, end="")
              failures = {
                  "multibyte_module_filenames_fit_a_native_component",
                  "multibyte_parent_components_are_bounded_too",
                  "nested_multibyte_paths_do_not_expand_past_the_native_path_budget",
                  "recovered_collisions_keep_writable_names_and_original_identities",
                  "source_map_paths_without_a_fallback_extension_are_bounded",
              }
              if result.returncode == 0 or "test result: FAILED. 2 passed; 5 failed;" not in result.stdout:
                  raise SystemExit("Original source did not reproduce five failures and two passing controls")
              failure_list = result.stdout.rsplit("failures:", 1)[-1].split("test result:", 1)[0]
              actual_failures = {line.strip() for line in failure_list.splitlines() if line.strip()}
              if actual_failures != failures:
                  raise SystemExit("Unexpected original-source failure set: " + repr(actual_failures))
          finally:
              path.write_bytes(fixed)
          PY
      - name: Run the full JavaScript and analysis suites
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --locked -p craft-anything-js -p craft-anything-analysis
      - name: Check fixed public recovery paths against the native filesystem
        run: |
          mkdir -p crates/js/examples
          trap 'rm -f crates/js/examples/validation_module_path_bytes.rs' EXIT
          cat > crates/js/examples/validation_module_path_bytes.rs <<'RUST'
          use std::io::Read;
          use craft_anything_js::{BundleModule, Limits};
          use craft_anything_js::recover::{RewriteLevel, recover_modules, safe_module_path};
          
          fn main() {
              let mut input = String::new();
              std::io::stdin().read_to_string(&mut input).unwrap();
              let ids: Vec<String> = serde_json::from_str(&input).unwrap();
              let paths: Vec<String> = ids.iter().map(|id| safe_module_path(id, ".js")).collect();
              let source = "globalThis.answer = 1;";
              let module = BundleModule {
                  id: ids[0].clone(),
                  format: "webpack".into(),
                  chunk_ids: vec![],
                  start: 0,
                  end: source.len() as u32,
                  body: Some((0, source.len() as u32)),
                  line: 1,
                  params: vec![],
                  deps: vec![],
                  sha256: "0123456789abcdef".into(),
                  fingerprint: String::new(),
              };
              let modules = recover_modules(source, &[module.clone(), module.clone(), module], RewriteLevel::None, &Limits::default());
              println!("{}", serde_json::json!({"paths": paths, "modules": modules}));
          }
          RUST
          cargo --config 'profile.dev.package."*".opt-level=0' build --locked -p craft-anything-js --example validation_module_path_bytes
          node <<'NODE'
          const assert = require("node:assert/strict");
          const fs = require("node:fs");
          const os = require("node:os");
          const path = require("node:path");
          const { execFileSync } = require("node:child_process");
          const ids = ["界".repeat(120), "𐐀".repeat(80), "界".repeat(100) + "/entry.js", "a".repeat(120), "模块/数据.js", ".././module"];
          const result = JSON.parse(execFileSync("target/debug/examples/validation_module_path_bytes", { input: JSON.stringify(ids), encoding: "utf8" }));
          const temporary = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP || os.tmpdir(), "craft-module-path-"));
          const outcomes = [];
          function save(relative, text, folder, expectedFailure) {
            const target = path.join(temporary, folder, relative);
            let error = null;
            try {
              fs.mkdirSync(path.dirname(target), { recursive: true });
              fs.writeFileSync(target, text, { flag: "wx" });
              assert.equal(fs.readFileSync(target, "utf8"), text);
            } catch (failure) {
              error = failure.code || String(failure);
            }
            outcomes.push({ folder, component_bytes: relative.split("/").map(p => Buffer.byteLength(p)), error });
            if (expectedFailure) assert.equal(error, "ENAMETOOLONG");
            else assert.equal(error, null);
          }
          try {
            const nameMax = execFileSync("getconf", ["NAME_MAX", temporary], { encoding: "utf8" }).trim();
            assert.equal(nameMax, "255");
            result.paths.forEach((relative, index) => save(relative, "fixture " + index, "path-" + index, false));
            assert.equal(new Set(result.modules.map(m => m.file_name)).size, 3);
            for (const module of result.modules) save(module.file_name, module.text, "recovered", false);
            assert.equal(outcomes.filter(o => o.error === "ENAMETOOLONG").length, 0);
            assert.equal(outcomes.filter(o => o.error === null).length, 9);
            console.log("Fixed public recovery paths on " + process.platform + " / Node " + process.version + " / NAME_MAX=" + nameMax + ": " + JSON.stringify(outcomes));
          } finally {
            fs.rmSync(temporary, { recursive: true, force: true });
          }
          NODE
      - name: Run strict all-target Clippy
        run: cargo --config 'profile.dev.package."*".opt-level=0' clippy --locked -p craft-anything-js -p craft-anything-analysis --all-targets -- -D warnings
      - name: Check repository contracts
        run: |
          cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
          cargo --config 'profile.dev.package."*".opt-level=0' xtask locks
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
      - name: Check all WebAssembly layers
        run: cargo --config 'profile.dev.package."*".opt-level=0' xtask wasm
      - name: Require formatting and an unchanged source tree
        run: |
          cargo fmt --all -- --check
          git diff --exit-code
