name: JavaScript object-table validation

on:
  push:
    branches: [validation/craft-js-object-entries-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: 7dc5e9191c7d09abb3eb5c37d4cd36544410a168
          fetch-depth: 0
          persist-credentials: false
      - name: Install the validated Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default 1.99.0
          rustc --version
          node --version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: craft-js-object-entries-v1
          save-if: true
          cache-on-failure: true
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Verify original and previous-head regression failures and controls
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          source = pathlib.Path("crates/js/src/bundle.rs")
          fixed = source.read_bytes()
          original_failures = [
              "repeated_module_keys_keep_only_the_final_function",
              "a_later_nonfunction_or_accessor_replaces_an_earlier_module",
              "accessors_are_not_recovered_as_module_bodies",
              "prototype_setters_do_not_hide_or_create_own_module_entries",
              "unknown_property_writes_leave_only_later_known_entries",
              "browserify_keeps_final_module_and_dependency_definitions",
              "esbuild_accessors_are_not_module_initializers",
              "browserify_nonmodule_replacements_remove_older_functions",
              "browserify_dependency_maps_keep_only_final_known_data_values",
              "a_shorthand_definition_can_replace_a_previous_module",
              "unknown_browserify_table_writes_report_incomplete_recovery",
              "unknown_browserify_dependency_writes_report_incomplete_recovery",
              "object_property_budget_counts_known_nonmodule_values",
              "browserify_dependency_property_budget_is_reported",
              "repeated_definitions_of_one_key_do_not_exhaust_the_property_budget",
          ]
          review_failures = [
              "unknown_property_writes_leave_only_later_known_entries",
              "unknown_browserify_table_writes_report_incomplete_recovery",
              "unknown_browserify_dependency_writes_report_incomplete_recovery",
              "object_property_budget_counts_known_nonmodule_values",
              "browserify_dependency_property_budget_is_reported",
          ]
          try:
              for revision, controls, failures in [
                  ("2cee4610f07164920ca9f02cd75cd84fa99cba3b", 1, original_failures),
                  ("b6ba499be2fddc38007dc5913e05dd30714e5432", 11, review_failures),
              ]:
                  print("Regression baseline: " + revision, flush=True)
                  original = subprocess.check_output(["git", "show", revision + ":crates/js/src/bundle.rs"])
                  source.write_bytes(original)
                  result = subprocess.run(
                      ["cargo", "--config", 'profile.dev.package."*".opt-level=0', "test", "--locked", "-p", "craft-anything-js",
                       "--test", "bundle_object_properties", "--", "--test-threads=1"],
                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True,
                  )
                  print(result.stdout, flush=True)
                  summary = "test result: FAILED. " + str(controls) + " passed; " + str(len(failures)) + " failed;"
                  if result.returncode == 0 or summary not in result.stdout:
                      raise SystemExit("Unexpected regression/control result for " + revision)
                  for name in failures:
                      if "test " + name + " ... FAILED" not in result.stdout:
                          raise SystemExit("Missing expected semantic failure: " + name)
          finally:
              source.write_bytes(fixed)
          PY
      - name: Run the complete JavaScript suite
        run: cargo --config 'profile.dev.package."*".opt-level=0' test --locked -p craft-anything-js
      - name: Compare the production analyzer with original Node objects
        run: |
          mkdir -p crates/js/examples
          trap 'rm -f crates/js/examples/validation_object_oracle.rs; rmdir crates/js/examples 2>/dev/null || true' EXIT
          cat > crates/js/examples/validation_object_oracle.rs <<'RS'
          use std::io::Read;

          fn main() -> Result<(), Box<dyn std::error::Error>> {
              let mut source = String::new();
              std::io::stdin().read_to_string(&mut source)?;
              let result = craft_anything_js::analyze("bundle.js", &source, &craft_anything_js::Limits::default());
              println!("{}", serde_json::to_string(&result)?);
              Ok(())
          }
          RS
          cargo --config 'profile.dev.package."*".opt-level=0' build --locked -p craft-anything-js --example validation_object_oracle
          node <<'JS'
          const assert = require("node:assert/strict");
          const { spawnSync } = require("node:child_process");
          function analyze(source) {
            const run = spawnSync("target/debug/examples/validation_object_oracle", {
              input: source, encoding: "utf8", timeout: 30000, maxBuffer: 4 * 1024 * 1024,
            });
            assert.equal(run.status, 0, run.stderr);
            const result = JSON.parse(run.stdout);
            assert.equal(result.facts.parse_errors, 0);
            return result.bundle;
          }
          const ordinary = Array.from({ length: 10 }, (_, i) => (i + 1) + ":function(e){e.exports=" + (i + 1) + "}").join(",");
          const prefix = Array.from({ length: 9 }, (_, i) => (i + 1) + ":function(e){e.exports=" + (i + 1) + "}").join(",");
          const cases = [
            ["duplicate", "{1:function(e,t,n){e.exports=n(2)},1:function(e,t,n){e.exports=n(3)}}", ["1"]],
            ["numeric", "{0x10:function(e){e.exports=2},'16':function(e){e.exports=3}}", ["16"]],
            ["computed", "{item:function(e){e.exports=2},['item']:function(e){e.exports=3}}", ["item"]],
            ["accessor", "{" + ordinary + ",get 1(){return 37}}", ["2","3","4","5","6","7","8","9","10"]],
            ["prototype", "{__proto__:function(e){e.exports=37}}", []],
            ["own-prototype", "{['__proto__']:function(e){e.exports=37},__proto__:function(e){e.exports=99}}", ["__proto__"]],
            ["spread", "{" + prefix + ",...more,10:function(e){e.exports=10}}", ["10"]],
            ["unknown-key", "{" + prefix + ",[dynamic]:function(e){e.exports=37},10:function(e){e.exports=10}}", ["10"]],
            ["ordinary", "{1:function(e,t,n){e.exports=n(2)},2:function(e){e.exports=37}}", ["1","2"]],
            ["method", "{item(e){e.exports=2},item(e){e.exports=3}}", ["item"]],
          ];
          function recovered(module, source) {
            assert.ok(module.body, "missing function body");
            const bytes = Buffer.from(source);
            return new Function(...module.params, bytes.subarray(module.body[0], module.body[1]).toString("utf8"));
          }
          function observeWebpack(fn) {
            const module = { exports: {} };
            const calls = [];
            fn(module, module.exports, id => { calls.push(String(id)); return String(id) + "-value"; });
            return { exports: module.exports, calls };
          }
          for (const [name, table, ids] of cases) {
            const source = "(self.webpackChunkx=self.webpackChunkx||[]).push([[1]," + table + "]);";
            const bundle = analyze(source);
            const modules = bundle.modules;
            assert.deepEqual(modules.map(module => module.id), ids, name);
            assert.equal(bundle.truncated, name === "spread" || name === "unknown-key", name + ": completeness");
            const self = { webpackChunkx: [] };
            const more = Object.fromEntries(Array.from({ length: 9 }, (_, i) => [String(i + 1), 37]));
            new Function("self", "more", "dynamic", source)(self, more, "1");
            const descriptors = Object.getOwnPropertyDescriptors(self.webpackChunkx[0][1]);
            for (const module of modules) {
              const original = descriptors[module.id].value;
              assert.equal(typeof original, "function", name);
              const expected = observeWebpack(original);
              assert.deepEqual(observeWebpack(recovered(module, source)), expected, name + ":" + module.id);
              assert.deepEqual(module.deps, [...new Set(expected.calls)], name + ": dependencies");
            }
            console.log("Node and production analyzer agree: " + name);
          }
          const source = "var modules={1:[function(r,m,e){m.exports=r('item')},{item:2,item:3}],1:[function(r,m,e){m.exports=r('item')},{item:4,item:5}],5:[function(r,m,e){m.exports=37},{}]};";
          const original = new Function(source + ";return modules;")();
          const bundle = analyze(source);
          const modules = bundle.modules;
          assert.deepEqual(modules.map(module => module.id), ["1", "5"]);
          assert.equal(bundle.truncated, false);
          for (const module of modules) {
            const entry = original[module.id];
            const observe = fn => {
              const output = { exports: {} };
              fn(name => entry[1][name] * 10, output, output.exports);
              return output.exports;
            };
            assert.deepEqual(observe(recovered(module, source)), observe(entry[0]));
            assert.deepEqual(module.deps, Object.values(entry[1]).map(String));
          }
          console.log("Node and production analyzer agree: browserify duplicate modules and mappings");
          for (const property of ["get 'src/item.js'(){return function(e,m){m.exports=37}}", "set 'src/item.js'(e){}"]) {
            const source = "var item=__commonJS({" + property + "});";
            const bundle = analyze(source);
            assert.deepEqual(bundle.modules, []);
            assert.equal(bundle.truncated, false);
            let object;
            new Function("__commonJS", source)(value => { object = value; });
            const descriptor = Object.getOwnPropertyDescriptor(object, "src/item.js");
            assert.equal(descriptor.value, undefined);
            console.log("Node and production analyzer agree: esbuild accessor");
          }
          console.log("All 13 original-object/production-analyzer scenarios passed");
          JS
      - name: Run strict all-target Clippy
        run: cargo --config 'profile.dev.package."*".opt-level=0' clippy --locked -p craft-anything-js --all-targets -- -D warnings
      - name: Check repository contracts
        run: |
          cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
          cargo --config 'profile.dev.package."*".opt-level=0' xtask locks
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
      - name: Check the complete WebAssembly layer gate
        run: cargo --config 'profile.dev.package."*".opt-level=0' xtask wasm
      - name: Require formatting and an unchanged tested tree
        run: |
          cargo fmt --all -- --check
          git diff --exit-code
