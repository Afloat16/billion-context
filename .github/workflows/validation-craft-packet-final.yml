name: Craft packet final lower-layer identity
on:
  push:
    branches: [validation/craft-packet-final-20261111]
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: candidate
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: validation
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: 8ede68574392af1cf9123a4aec179b5557689964
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Verify the exact tested product and current-main replay
        run: |
          git fetch --no-tags --depth=1 origin 86d047cbc5368ca595c83e045893fb39c7f3f7f8
          git fetch --no-tags --depth=1 origin 06342656204c5ef25d145ec632468914d2a2982e
          git fetch --no-tags --depth=1 origin 46c531c9d21c2dab35f2ae62d22c72786b931ea2
          python3 "$GITHUB_WORKSPACE/validation/.github/validation/packet_final_identity.py"
      - name: Install fixed CI formatting toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0
      - name: Check formatting and repository contracts
        run: |
          cargo fmt --all -- --check
          cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
          cargo --config 'profile.dev.package."*".opt-level=0' xtask locks
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
      - name: Check patch whitespace and clean checkout
        run: |
          git diff --check 86d047cbc5368ca595c83e045893fb39c7f3f7f8 HEAD
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
