name: Craft SQLite final documentation identity
on:
  push:
    branches: [validation/craft-sqlite-schema-completeness-20261111]
permissions:
  contents: read
jobs:
  final-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: candidate
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: e44c7a07828514d2c22d82accf7183e28cf2c83d
          path: candidate
          fetch-depth: 2
          persist-credentials: false
      - name: Prove the final commit changes documentation only
        run: |
          git fetch --no-tags --depth=1 origin 3a9ad9c6c5de05701d423b8c7e9cc37b550a7170
          python3 - <<'PY'
          import subprocess
          before = "fca8b0c7f9f4fd54a172bf9fe834393f54844a23"
          expected = ["docs/ROADMAP.md", "docs/STATUS.md"]
          files = subprocess.check_output(["git", "diff", "--name-only", before, "HEAD"], text=True).splitlines()
          assert files == expected, files
          subprocess.run(["git", "diff", "--exit-code", before, "HEAD", "--", "crates", "Cargo.toml", "Cargo.lock", "rustfmt.toml"], check=True)
          print("Exact final head differs from the fully tested candidate only in ROADMAP and STATUS.")
          PY
          git diff --check 3a9ad9c6c5de05701d423b8c7e9cc37b550a7170 HEAD
      - name: Install CI Rust for repository checks
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
      - name: Check final repository layers, locks and secrets
        run: |
          cargo --config 'profile.dev.package."*".opt-level=0' xtask layers
          cargo --config 'profile.dev.package."*".opt-level=0' xtask locks
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard)"
