name: WebAssembly final documentation and WAT check

on:
  push:
    branches: [validation/craft-wasm-component-final-20261111]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_OPT_LEVEL: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Afloat16/craft-anything
          ref: 8d3327b290b9bd928650ee331dd87c8399d19c85
          fetch-depth: 0
          persist-credentials: false
      - name: Verify every non-document file matches the fully tested implementation
        run: |
          python3 - <<'PY'
          import subprocess
          changed = subprocess.check_output(["git", "diff", "--name-only", "f7884f8bbd641aeb5ab0666feb813e4daa3c113c", "HEAD"], text=True).splitlines()
          if not changed or any(path not in {"docs/ROADMAP.md", "docs/STATUS.md"} for path in changed):
              raise SystemExit("Unexpected non-document change: " + repr(changed))
          print("Every production, test, dependency, build and workflow file matches the fully tested implementation.")
          print("Documentation changes:", changed)
          PY
      - name: Install the same Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt
          rustup default 1.99.0
          rustc --version
      - name: Check formatting and documentation contracts
        run: |
          cargo fmt --all -- --check
          cargo --config 'profile.dev.package."*".opt-level=0' xtask secrets
          git diff --check "f7884f8bbd641aeb5ab0666feb813e4daa3c113c" HEAD
      - name: Check actual WAT-generated components with the public reader
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          proof = pathlib.Path(os.environ["RUNNER_TEMP"]) / "component-layout-proof"
          proof.joinpath("src").mkdir(parents=True, exist_ok=True)
          source_path = pathlib.Path.cwd() / "crates/formats"
          manifest = '[package]\nname="component-layout-proof"\nversion="0.1.0"\nedition="2024"\n[dependencies]\nwat="=1.261.0"\ncraft-anything-formats={path=' + json.dumps(str(source_path)) + '}\n'
          proof.joinpath("Cargo.toml").write_text(manifest, encoding="utf-8")
          proof.joinpath("src/main.rs").write_text("use craft_anything_formats::wasm::inspect;\n\nfn main() {\n    let cases: [(&str, &str, &[&str]); 8] = [\n        (\"empty\", \"(component)\", &[]),\n        (\"embedded-core\", \"(component (core module (func (export \\\"f\\\") (result i32) i32.const 42)))\", &[\"core-module\"]),\n        (\"nested-component\", \"(component (component (core module (func))))\", &[\"component\"]),\n        (\"function-type\", \"(component (type (func)))\", &[\"type\"]),\n        (\"core-instantiation\", \"(component (core module $m (func (export \\\"f\\\"))) (core instance (instantiate $m)))\", &[\"core-module\", \"core-instance\", \"custom:component-name\"]),\n        (\"function-import\", \"(component (type $f (func)) (import \\\"work\\\" (func (type $f))))\", &[\"type\", \"import\", \"custom:component-name\"]),\n        (\"instance-import\", \"(component (type $i (instance)) (import \\\"unit\\\" (instance (type $i))))\", &[\"type\", \"import\", \"custom:component-name\"]),\n        (\"function-reexport\", \"(component (type $f (func)) (import \\\"work\\\" (func $work (type $f))) (export \\\"work\\\" (func $work)))\", &[\"type\", \"import\", \"export\", \"custom:component-name\"]),\n    ];\n    for (label, source, expected) in cases {\n        let bytes = wat::parse_str(source).unwrap();\n        let report = inspect(&bytes).unwrap();\n        assert!(report.validation.valid, \"{label}: {:?}\", report.validation);\n        assert!(report.parse_error.is_none(), \"{label}: {:?}\", report.parse_error);\n        assert_eq!(report.encoding, \"component\", \"{label}\");\n        assert_eq!(report.version, 13, \"{label}\");\n        let actual = report.sections.iter().map(|s| s.name.as_str()).collect::<Vec<_>>();\n        assert_eq!(actual, expected, \"{label}\");\n        let expected_custom = expected.iter().filter_map(|name| name.strip_prefix(\"custom:\")).collect::<Vec<_>>();\n        assert_eq!(report.custom_sections.iter().map(|s| s.name.as_str()).collect::<Vec<_>>(), expected_custom, \"{label}\");\n        assert!(report.functions.is_empty() && report.imports.is_empty() && report.exports.is_empty(), \"{label}\");\n        assert!(report.sections.iter().all(|s| s.offset + s.size <= bytes.len() as u64), \"{label}\");\n        println!(\"{label}: {} generated bytes; top-level sections {:?}\", bytes.len(), actual);\n    }\n}\n", encoding="utf-8")
          PY
          cargo --config 'profile.dev.package."*".opt-level=0' run --manifest-path "$RUNNER_TEMP/component-layout-proof/Cargo.toml" --target-dir target
      - name: Verify the tested tree remains unchanged
        run: git diff --exit-code
